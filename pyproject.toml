[project]
name = "jev-opencode-toolkit"
version = "0.1.0"
description = "A lean TypeSafe Jev toolkit for opencode: batched typed questions, bounded concurrency, content-hash cache, pinned rubrics, and a calibration lock."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[project.scripts]
jev-lock = "jev_toolkit.calibrate:main"
jev-mcp = "jev_toolkit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_toolkit"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits the real TypeSafe API (requires TYPESAFE_API_KEY; skipped otherwise)",
]
